[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-ad-tagger"
version = "1.1.0"
description = "Find (and cut) the ads in podcast episodes, locally."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "onnxruntime>=1.17",
    "llama-cpp-python>=0.3.9",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
adstrip = "podcast_ad_tagger.cli:main"

[tool.setuptools]
packages = ["podcast_ad_tagger"]
